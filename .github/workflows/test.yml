permissions:
  contents: read
name: Test

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  rspec:
    strategy:
      matrix:
        os:
          - blacksmith-4vcpu-ubuntu-2404
          - ubuntu-26.04
          - blacksmith-6vcpu-macos-15
          - blacksmith-6vcpu-macos-26
        ruby-version:
          - "3.3"
          - "3.4"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
      - name: Install dependencies
        run: bundle install
      - name: Run tests
        run: bundle exec rake
        env:
          ISOLATED: true
